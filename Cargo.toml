[package]
name = "MyDNS"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
rcgen = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
